name: Build Word doc

# Non-technical workflow: open the Actions tab on GitHub, click "Build Word doc"
# -> "Run workflow", paste a chapter URL, and click the green button. When it
# finishes (~1 min), download the .docx from the run's "Artifacts" section.
# No terminal, no local install, no YAML to edit.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Chapter landing-page URL (the tool finds its sub-pages automatically)"
        required: false
        type: string
      manifest:
        description: "...or leave the URL blank and pick a saved review set"
        required: false
        type: choice
        default: examples/before-you-deploy-chapter.yml
        options:
          - examples/before-you-deploy-chapter.yml
          - examples/before-you-deploy.yml
          - examples/data-processing.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build styled reference document
        run: python scripts/make_reference.py styles.docx

      - name: Convert to Word
        # URL and manifest come in as env vars (not inlined into the script) to
        # avoid shell-injection from the free-text URL input.
        env:
          URL: ${{ inputs.url }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          if [ -n "$URL" ]; then
            python -m web2word "$URL" -o review-document.docx \
              --save-manifest discovered-manifest.yml -v
          else
            python -m web2word "$MANIFEST" -o review-document.docx -v
          fi

      - name: Verify links (fails if any internal link is dead)
        run: python scripts/verify.py review-document.docx

      - name: Upload the Word document
        uses: actions/upload-artifact@v4
        with:
          name: review-document
          path: review-document.docx

      - name: Upload the discovered manifest (when a URL was used)
        if: ${{ inputs.url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: discovered-manifest
          path: discovered-manifest.yml
          if-no-files-found: ignore
